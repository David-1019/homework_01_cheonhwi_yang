version: 0.0 #appspec.yml 버전. 지원버전 0.0 하나밖에 없음
os: linux

# zip 안의 전체 파일(/)을 EC2의 /home/ubuntu/2.structure 으로 복사
files:
  - source: /
    destination: /home/ubuntu/2.structure
# 같은 파일이 있으면 덮어쓰기
file_exists_behavior: OVERWRITE

# 복사된 파일의 소유자를 ubuntu로 지정 (기본은 root)
permissions:
  - object: /home/ubuntu/2.structure
    owner: ubuntu
    group: ubuntu

# 배포 단계별로 실행할 스크립트
hooks:
  BeforeInstall:            # 파일 복사 "전"
    - location: scripts/before_install.sh
      timeout: 60
      #codedeploy가 root 만든 파일이 있을 수 있어 root 권한으로 실행
      runas: root 
  AfterInstall:             # 파일 복사 "후"
    - location: scripts/after_install.sh
      timeout: 300
      #venv 설치 시 root로 설치하면 이후 ubuntu로 실행할 수 없음. 권한 최소화
      runas: ubuntu
  ApplicationStart:         # 서버 실행
    - location: scripts/start_server.sh
      timeout: 60
      #시스템 서비스 제어는 관리자 권한이 필요
      runas: root
  ValidateService:          # 정상 동작 확인
    - location: scripts/validate.sh
      timeout: 60
      #단순 요청이라 일반 사용자로 진행
      runas: ubuntu

